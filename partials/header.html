<header class="site-header" id="siteHeader">
  <div class="container header__inner">
    <!-- Brand -->
    <a class="brand" href="index.html" aria-label="Startseite — Mika Schieferdecker">
      <span class="brand__mark" aria-hidden="true">MS</span>
    </a>
    
    <!-- Main Navigation -->
    <nav class="nav" aria-label="Hauptnavigation">
      <ul class="nav__list" id="navList">
        <li><a href="arbeiten.html">Projekte</a></li>
        <li><a href="ueber.html">Über Mich</a></li>
        <li><a href="leistungen.html">Service</a></li>
        <li><a href="kontakt.html">Kontakt</a></li>
      </ul>
    </nav>
    
    <!-- Actions Container -->
    <div class="header__actions">
      
      <!-- 1. Menü Toggle (Ganz nach vorne geschoben für bessere Klickbarkeit) -->
      <button class="menu-toggle" id="menuToggle" aria-label="Menü öffnen">
        <span></span><span></span><span></span>
      </button>

      <!-- 2. Theme Switcher -->
      <label class="theme-switch" title="Dark Mode umschalten">
        <input type="checkbox" id="themeToggle">
        <span class="slider">
          <svg class="icon sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
          </svg>
          <svg class="icon moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </span>
      </label>

      <!-- 3. Projekt anfragen Button -->
      <a href="projekt-anfrage.html" class="btn btn--primary" style="padding: 6px 16px; min-height: 38px; font-size: 0.85rem; margin-left: 8px;">Projekt anfragen</a>
    </div>
  </div>
</header>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    // 1. Theme-Toggle Logik
    const toggle = document.getElementById('themeToggle');
    const root = document.documentElement;
    
    if (localStorage.getItem('theme') === 'dark') {
      root.setAttribute('data-theme', 'dark');
      toggle.checked = true;
    }
    
    toggle.addEventListener('change', () => {
      const isDark = toggle.checked;
      root.setAttribute('data-theme', isDark ? 'dark' : 'light');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    });

    // 2. Menü-Toggle Logik
    const menuToggle = document.getElementById('menuToggle');
    const nav = document.querySelector('.nav');

    if (menuToggle && nav) {
      menuToggle.addEventListener('click', (e) => {
        e.stopPropagation(); // Klick isolieren
        
        const isExpanded = menuToggle.getAttribute('aria-expanded') === 'true';
        menuToggle.setAttribute('aria-expanded', !isExpanded);
        nav.classList.toggle('is-open');
        
        console.log('Menü-Status:', nav.classList.contains('is-open'));
      });
    }
  });
</script>
